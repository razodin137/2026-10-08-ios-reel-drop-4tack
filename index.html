<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rough Cut — press record, decide later</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ff4b4b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230e0f12'/%3E%3C/svg%3E">
<style>
/* Hallmark · component: studio tool · genre: terminal/utilitarian · theme: graphite + signal red
 * states: default · hover · focus-visible · active · disabled · recording · playing · empty */
:root{
  --bg: oklch(15% 0.008 260);
  --panel: oklch(18% 0.01 260);
  --panel-2: oklch(22% 0.012 260);
  --line: oklch(30% 0.012 260);
  --ink: oklch(93% 0.004 260);
  --ink-dim: oklch(64% 0.01 260);
  --accent: oklch(64% 0.21 27);
  --accent-dim: oklch(64% 0.21 27 / .35);
  --danger: oklch(64% 0.19 27);
  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r: 6px;
  --ease: cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.45 var(--font-ui);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
button{
  font:inherit; color:var(--ink); background:var(--panel-2);
  border:1px solid var(--line); border-radius:var(--r);
  padding:5px 10px; cursor:pointer;
}
button:hover{background:oklch(26% 0.014 260)}
button:active{transform:translateY(1px)}
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--ink); outline-offset:1px;
}
input[type=text], input[type=number], textarea{
  font:inherit; color:var(--ink); background:var(--panel-2);
  border:1px solid var(--line); border-radius:var(--r); padding:5px 8px;
}
input::placeholder, textarea::placeholder{color:var(--ink-dim)}

/* ---------- toolbar ---------- */
#top{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:var(--s2) var(--s3);
  padding:var(--s2) var(--s4);
  background:var(--panel); border-bottom:1px solid var(--line);
}
.tg{display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; min-width:0}
.t-right{justify-content:flex-end}
#recBtn{
  width:42px; height:42px; border-radius:50%;
  background:var(--accent); border:none; position:relative; flex:none;
  transition:transform .12s var(--ease);
}
#recBtn::after{
  content:''; position:absolute; inset:13px; border-radius:50%;
  background:var(--bg); transition:border-radius .12s var(--ease);
}
#recBtn:hover{transform:scale(1.05)}
#recBtn:active{transform:scale(.96)}
body.recording #recBtn::after{border-radius:3px}
body.recording #recBtn{animation:pulse 1.5s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px var(--accent-dim)}}
@media (prefers-reduced-motion: reduce){
  body.recording #recBtn{animation:none}
  *{transition:none !important}
}
#playBtn{
  width:34px; height:34px; border-radius:50%;
  position:relative; flex:none; padding:0;
}
#playBtn .tri{
  position:absolute; left:13px; top:10px;
  border-style:solid; border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent var(--ink);
}
#playBtn .bars{display:none}
body.playing #playBtn .tri{display:none}
body.playing #playBtn .bars{display:block}
body.playing #playBtn .bars::before, body.playing #playBtn .bars::after{
  content:''; position:absolute; top:10px; bottom:10px; width:4px;
  background:var(--ink); border-radius:1px;
}
body.playing #playBtn .bars::before{left:11px}
body.playing #playBtn .bars::after{right:11px}
#time{
  font:12.5px var(--font-mono); color:var(--ink-dim);
  min-width:86px; flex:none; letter-spacing:.02em;
}
body.recording #time{color:var(--accent)}
#meter{
  width:84px; height:5px; background:var(--panel-2);
  border-radius:2px; overflow:hidden; display:none; flex:none;
}
body.recording #meter{display:block}
#meterFill{
  height:100%; width:100%; background:var(--accent);
  transform:scaleX(var(--lvl,0)); transform-origin:left;
}
#sessionName{width:190px}
.chip{
  display:flex; align-items:center; gap:5px;
  font-size:12px; color:var(--ink-dim);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r); padding:4px 9px; cursor:pointer; flex:none;
}
.chip:hover{color:var(--ink)}
.chip input[type=checkbox]{accent-color:var(--accent)}
.chip .cv{font-weight:600; color:var(--ink)}
.chip.edit .cv{display:none}
.chip .fld{
  display:none; width:0; padding:0; border:none; background:transparent;
  font:12px var(--font-ui); color:var(--ink);
}
.chip.edit .fld{display:block; width:62px; padding:0 2px}
.chip.edit{border-color:var(--ink-dim)}
#zoomOut,#zoomIn{width:32px; padding:5px 0; flex:none}
#zipBtn,#newBtn{font-size:12px; color:var(--ink-dim)}

/* ---------- timeline ---------- */
#tl{flex:1; overflow:auto; position:relative; background:var(--bg)}
#content{position:relative}
#rulerWrap{
  position:sticky; top:0; left:0; z-index:6;
  height:30px; background:var(--panel);
  border-bottom:1px solid var(--line); cursor:crosshair;
}
#ruler{display:block}
#lanes{position:absolute; top:0; left:0; right:0; bottom:0}
.bar{
  position:absolute; height:50px; border-radius:var(--r);
  background:color-mix(in oklab, var(--lane) 24%, var(--panel));
  border:1px solid color-mix(in oklab, var(--lane) 55%, var(--line));
  cursor:grab; overflow:hidden; touch-action:none;
}
.bar:hover{background:color-mix(in oklab, var(--lane) 32%, var(--panel))}
.bar.selected{outline:2px solid var(--ink); outline-offset:-1px}
.bar .wave{position:absolute; inset:0; width:100%; height:100%; opacity:.9}
.bar .tname{
  position:absolute; left:8px; top:4px; font-weight:600; font-size:12px;
  color:oklch(97% 0.01 var(--lane-h,260));
  text-shadow:0 1px 2px oklch(10% 0.01 260 / .8);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; right:8px;
}
.bar .tmeta{
  position:absolute; left:8px; bottom:4px; font-size:10.5px;
  color:oklch(88% 0.01 var(--lane-h,260) / .85);
  text-shadow:0 1px 2px oklch(10% 0.01 260 / .8);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; right:8px;
}
.bar .tdur{
  position:absolute; right:8px; top:4px; font:10.5px var(--font-mono);
  color:oklch(88% 0.01 var(--lane-h,260) / .8);
  text-shadow:0 1px 2px oklch(10% 0.01 260 / .8);
}
#playhead{
  position:absolute; top:0; bottom:0; width:2px;
  background:var(--accent); z-index:5; pointer-events:none;
}

/* ---------- cues ---------- */
#cues{position:absolute; top:0; left:0; right:0; height:30px; z-index:7; pointer-events:none}
.cue{
  position:absolute; top:0; width:14px; height:100%; margin-left:-7px;
  pointer-events:auto; cursor:grab; touch-action:none;
}
.cue::before{
  content:''; position:absolute; left:6px; top:13px; bottom:0; width:2px;
  background:var(--ink-dim);
}
.cue::after{
  content:''; position:absolute; left:2px; top:2px; width:10px; height:10px;
  border-radius:2px; background:var(--panel-2); border:2px solid var(--ink-dim);
  transform:rotate(45deg); box-sizing:border-box;
}
.cue:hover::before{background:var(--ink)}
.cue:hover::after{border-color:var(--ink)}
.cue.selected::before{background:var(--accent)}
.cue.selected::after{border-color:var(--accent); background:var(--accent)}
#empty{
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
  color:var(--ink-dim); font-size:14px; pointer-events:none;
}

/* ---------- metadata panel ---------- */
#panel{
  border-top:1px solid var(--line); background:var(--panel);
  padding:var(--s3) var(--s4); min-height:74px;
  display:flex; gap:var(--s3); align-items:flex-start; flex-wrap:wrap;
}
#panel .f{display:flex; flex-direction:column; gap:3px; flex:none}
#panel .f span{font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em}
#panel .grow{flex:1; min-width:220px}
#panel textarea{resize:vertical; min-height:38px}
#panel .keep{flex-direction:row; align-items:center; gap:6px; padding-top:14px; cursor:pointer}
#panel .keep input{accent-color:var(--accent); width:15px; height:15px}
#panel .keep span{font-size:12px}
.pmeta{
  font:10.5px var(--font-mono); color:var(--ink-dim);
  padding-top:16px; max-width:210px;
}
#fDelete{border-color:oklch(30% 0.06 27); color:var(--danger)}
#fDelete:hover{background:oklch(64% 0.19 27 / .15)}
#fVid{
  width:200px; max-height:112px; background:#000;
  border-radius:var(--r); border:1px solid var(--line);
}
#panel.empty{color:var(--ink-dim); font-size:12.5px; align-items:center; min-height:52px}
#panel.cue-mode{align-items:flex-start}
#sessionNotes{
  flex:1; min-width:200px; border:none; background:transparent;
  font:13px/1.45 var(--font-ui); color:var(--ink-dim); resize:none;
}
#sessionNotes:focus{color:var(--ink)}
#panel .slabel{font-size:10.5px; color:var(--ink-dim); letter-spacing:.04em}

/* ---------- misc ---------- */
#camPreview{
  position:fixed; right:var(--s4); bottom:110px; width:190px;
  border-radius:var(--r); border:1px solid var(--line);
  background:#000; z-index:20;
}
.hidden{display:none !important}
#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
  background:var(--panel-2); border:1px solid var(--line);
  color:var(--ink); border-radius:var(--r);
  padding:8px 14px; font-size:12.5px; z-index:30;
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease);
}
#toast.show{opacity:1}
.tl-video{position:fixed; left:-9999px; top:0; width:2px; height:2px}
</style>
</head>
<body>

<header id="top">
  <div class="tg t-left">
    <button id="playBtn" title="Play / pause (Space)" aria-label="Play">
      <span class="tri"></span><span class="bars"></span>
    </button>
    <span id="time">0:00.0</span>
    <div id="meter"><div id="meterFill"></div></div>
  </div>
  <div class="tg t-center">
    <label class="chip" id="vidChip" title="Record video too"><input id="videoChk" type="checkbox"> video</label>
    <button id="recBtn" title="Record (R)" aria-label="Record"></button>
    <input id="sessionName" type="text" placeholder="untitled session" aria-label="Session name">
    <div class="chip" id="bpmChip" role="button" tabindex="0" title="Session bpm">
      <span class="lb">bpm</span><span class="cv"></span><input class="fld" type="number" min="0" step="any" placeholder="—" aria-label="Session bpm">
    </div>
    <div class="chip" id="keyChip" role="button" tabindex="0" title="Session key">
      <span class="lb">key</span><span class="cv"></span><input class="fld" type="text" placeholder="—" aria-label="Session key">
    </div>
  </div>
  <div class="tg t-right">
    <button id="zoomOut" title="Zoom out">−</button>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="exportBtn" title="Export takes as markdown + media into a folder">export</button>
    <button id="zipBtn" title="Download everything as one .zip">zip</button>
    <button id="newBtn" title="Delete all takes, start fresh">new</button>
  </div>
</header>

<main id="tl">
  <div id="content">
    <div id="rulerWrap"><canvas id="ruler"></canvas></div>
    <div id="cues"></div>
    <div id="lanes"></div>
    <div id="playhead"></div>
    <div id="empty">press record — everything else can wait</div>
  </div>
</main>

<footer id="panel" class="empty"></footer>

<video id="camPreview" class="hidden" muted autoplay playsinline></video>
<div id="toast" role="status"></div>

<script>
'use strict';
/* Rough Cut — a rough-timeline idea recorder. The anti-DAW: press record first,
 * name/bpm/key/tags/notes whenever you feel like it, export as markdown + media. */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, cls) => { const e = document.createElement(t); if (cls) e.className = cls; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = s => JSON.stringify(String(s));           // JSON string = valid YAML scalar
const isoNow = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2));
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'take';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const fmtTime = s => { s = Math.max(0, s); const m = Math.floor(s / 60), ss = s - m * 60;
  return m + ':' + String(Math.floor(ss)).padStart(2, '0') + '.' + Math.floor((ss % 1) * 10); };
const fmtClock = s => { s = Math.max(0, s); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
// bar.beat.tenths position (4/4) from timeline seconds + session bpm; null if no session bpm
const barPos = sec => {
  const bpm = state.session.bpm;
  if (!bpm) return null;
  const beats = Math.round(sec * bpm / 60 * 10) / 10;   // nearest tenth of a beat
  return (Math.floor(beats / 4) + 1) + '.' + (Math.floor(beats % 4) + 1) + '.' + Math.round((beats % 1) * 10);
};

/* ---------- constants & state ---------- */
const RULERH = 30, ROWH = 62, BARH = 50;
const LANES = [ // muted, distinguishable hues (oklch hue angles)
  { h: 230, c: '#7fa3c4' }, { h: 130, c: '#93bd85' }, { h: 75,  c: '#c4b07f' },
  { h: 300, c: '#b08fc4' }, { h: 350, c: '#c48f9f' }, { h: 180, c: '#7fc4bd' },
];
const state = {
  session: { name: '', bpm: null, key: '', notes: '', created: isoNow() },
  takes: [],            // {id,name,kind,start,duration,recordedAt,bpm,key,tags,notes,keep,mime,ext,blob,buffer,peaks,lane}
  cues: [],             // {id,pos,name,notes}
  selectedId: null,
  selectedCueId: null,
  playhead: 0,
  zoom: 40,             // px per second
  playing: false,
  lanes: 6, contentSec: 120, contentPx: 4800,
};
let audioCtx = null;
let rec = null;         // active recording session
let panelUrl = null;    // object URL of the video in the metadata panel
const play = { sources: [], startCtx: 0, startPos: 0, raf: 0, videos: new Map() };

const takeById = id => state.takes.find(t => t.id === id);
const contentEnd = () => state.takes.reduce((m, t) => Math.max(m, t.start + t.duration), 0);

function ensureCtx(){ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

/* ---------- IndexedDB persistence (blobs included, reload-safe) ---------- */
let db = null;
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open('rough-cut', 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore('takes', { keyPath: 'id' }); rq.result.createObjectStore('meta'); };
    rq.onsuccess = () => { db = rq.result; res(); };
    rq.onerror = () => rej(rq.error);
  });
}
function idbPutTake(t){
  if (!db) return;
  const { buffer, peaks, el, _decoding, ...record } = t;   // strip runtime fields
  try { db.transaction('takes', 'readwrite').objectStore('takes').put(record); } catch (e) {}
}
function idbDelTake(id){ if (!db) return; try { db.transaction('takes', 'readwrite').objectStore('takes').delete(id); } catch (e) {} }
function idbAllTakes(){
  return new Promise((res, rej) => {
    if (!db) return res([]);
    const rq = db.transaction('takes').objectStore('takes').getAll();
    rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
  });
}
function idbSetMeta(k, v){ if (!db) return; try { db.transaction('meta', 'readwrite').objectStore('meta').put(v, k); } catch (e) {} }
function idbGetMeta(k){
  return new Promise(res => {
    if (!db) return res(null);
    const rq = db.transaction('meta').objectStore('meta').get(k);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
  });
}
const saveCues = debounce(() => { if (db) try { db.transaction('meta', 'readwrite').objectStore('meta').put(state.cues, 'cues'); } catch (e) {} }, 300);

/* ---------- toasts ---------- */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- decoding & waveforms ---------- */
async function ensurePeaks(t){
  if (t.peaks || t._decoding) return;
  t._decoding = true;
  try {
    ensureCtx();
    const ab = await t.blob.arrayBuffer();
    const buf = await audioCtx.decodeAudioData(ab);
    t.buffer = buf; t.duration = buf.duration;
    const per = 60, n = Math.max(1, Math.ceil(buf.duration * per)), spc = Math.max(1, Math.floor(buf.sampleRate / per));
    const peaks = new Float32Array(n), chs = [];
    for (let c = 0; c < Math.min(2, buf.numberOfChannels); c++) chs.push(buf.getChannelData(c));
    for (let i = 0; i < n; i++){
      let m = 0; const s0 = i * spc, s1 = Math.min(buf.length, s0 + spc);
      for (const d of chs) for (let s = s0; s < s1; s += 4){ const v = Math.abs(d[s]); if (v > m) m = v; }
      peaks[i] = m;
    }
    t.peaks = peaks;
  } catch (e) { t.decodeFailed = true; }
  t._decoding = false;
  idbPutTake(t);          // duration may have been refined
  scheduleRefresh();
}
const scheduleRefresh = debounce(() => { layout(); renderAll(); }, 60);

/* ---------- timeline layout & render ---------- */
function layout(){
  // greedy lane packing: each take lands in the first lane with no overlap
  const sorted = [...state.takes].sort((a, b) => a.start - b.start);
  const ends = [];
  for (const t of sorted){
    let l = 0;
    while (l < ends.length && t.start < ends[l]) l++;
    t.lane = l; ends[l] = t.start + t.duration;
  }
  state.lanes = Math.max(6, ends.length);
  const tl = $('#tl');
  const minSec = tl ? tl.clientWidth / state.zoom : 30;
  state.contentSec = Math.max(contentEnd() + 30, minSec);
  state.contentPx = Math.ceil(state.contentSec * state.zoom);
}
function renderAll(){
  const c = $('#content');
  c.style.width = state.contentPx + 'px';
  c.style.height = (RULERH + state.lanes * ROWH + 20) + 'px';
  const lanes = $('#lanes'); lanes.innerHTML = '';
  for (const t of state.takes) lanes.appendChild(barEl(t));
  $('#empty').style.display = state.takes.length ? 'none' : 'flex';
  renderCues();
  sizeRuler(); drawRuler(); syncPlayheadUI(state.playhead);
}
function refresh(){ layout(); renderAll(); }

function barEl(t){
  const lane = LANES[t.lane % LANES.length];
  const b = el('div', 'bar');
  b.dataset.id = t.id;
  b.style.left = (t.start * state.zoom) + 'px';
  b.style.width = Math.max(16, t.duration * state.zoom) + 'px';
  b.style.top = (RULERH + t.lane * ROWH + 6) + 'px';
  b.style.setProperty('--lane', lane.c);
  b.style.setProperty('--lane-h', lane.h);
  if (t.kind === 'video') b.classList.add('video');
  if (state.selectedId === t.id) b.classList.add('selected');
  const cv = el('canvas', 'wave'); b.appendChild(cv);
  const nm = el('div', 'tname'); nm.textContent = t.name; b.appendChild(nm);
  const du = el('div', 'tdur'); du.textContent = fmtClock(t.duration); b.appendChild(du);
  const me = el('div', 'tmeta'); me.textContent = barMeta(t); b.appendChild(me);
  drawWave(t, cv);
  attachBarEvents(b, t);
  t.el = b;
  return b;
}
function barMeta(t){
  const bits = [];
  if (t.bpm) bits.push(t.bpm + ' bpm');
  if (t.key) bits.push(t.key);
  const bp = barPos(t.start);
  if (bp) bits.push('bar ' + bp);
  if (t.tags && t.tags.length) bits.push(t.tags.map(x => '#' + x).join(' '));
  if (t.keep) bits.push('keep');
  bits.push(t.kind);
  return bits.join(' · ');
}
function updateBarText(t){
  if (!t.el) return;
  t.el.querySelector('.tname').textContent = t.name;
  t.el.querySelector('.tmeta').textContent = barMeta(t);
  t.el.querySelector('.tdur').textContent = fmtClock(t.duration);
}
function drawWave(t, cv){
  const w = Math.max(1, Math.round(t.duration * state.zoom)), h = BARH;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.min(16000, Math.max(1, Math.round(w * dpr)));
  cv.height = Math.round(h * dpr);
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  if (!t.peaks){ g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, h / 2 - 1, w, 2); return; }
  const lane = LANES[t.lane % LANES.length];
  g.fillStyle = lane.c;
  const n = t.peaks.length;
  for (let x = 0; x < w; x += 2){
    const p = t.peaks[Math.min(n - 1, Math.floor(x / w * n))];
    const bh = Math.max(1, p * (h - 10));
    g.fillRect(x, (h - bh) / 2, 1.4, bh);
  }
}

/* ---------- ruler ---------- */
function sizeRuler(){
  const tl = $('#tl');
  $('#rulerWrap').style.width = tl.clientWidth + 'px';
}
function drawRuler(){
  const tl = $('#tl'), w = tl.clientWidth, cv = $('#ruler');
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(RULERH * dpr);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const off = tl.scrollLeft, z = state.zoom;
  const steps = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1200];
  const step = steps.find(s => s * z >= 72) || 1200;
  g.font = '10px ' + getComputedStyle(document.body).getPropertyValue('--font-mono');
  g.strokeStyle = 'rgba(255,255,255,.22)';
  g.fillStyle = 'rgba(255,255,255,.5)';
  const first = Math.max(0, Math.floor(off / z / step) * step);
  for (let s = first; s * z <= off + w; s += step){
    const x = Math.round(s * z - off) + .5;
    g.beginPath(); g.moveTo(x, RULERH - 8); g.lineTo(x, RULERH - 1); g.stroke();
    g.fillText(fmtClock(s), x + 4, 14);
  }
}

/* ---------- cues ---------- */
function cueById(id){ return state.cues.find(c => c.id === id); }
function renderCues(){

function cueTitle(c){
  const bits = [fmtClock(c.pos)];

function syncCueDom(c){

function attachCueEvents(d, c){
  let px0 = 0, p0 = 0, moved = false, dragging = false;
  d.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    px0 = e.clientX; p0 = c.pos; moved = false; dragging = true;
    try { d.setPointerCapture(e.pointerId); } catch (err) {}
  });
  d.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - px0;
    if (Math.abs(dx) > 3) moved = true;

      c.pos = Math.max(0, p0 + dx / state.zoom);
      d.style.left = (c.pos * state.zoom) + 'px';

  d.addEventListener('pointerup', () => {
    dragging = false;
    if (moved){ saveCues(); renderCues(); d.title = cueTitle(c); renderPanelIfCue(); }
    else selectCue(c.id);

function addCue(pos){

function deleteCue(id){

function deleteTake(id){

/* ---------- recording ---------- */
/* live-device cache: keep the granted stream around between takes so the browser
   doesn't re-prompt for mic/camera on every take. Released when the video mode
   changes, the session resets, or the user revokes the device mid-session. */
let media = null;
function releaseMedia(){
  if (!media) return;
  media.stream.getTracks().forEach(tr => tr.stop());
  media = null;
}
async function getMedia(wantVideo){
  if (media){
    const allLive = media.stream.getTracks().every(tr => tr.readyState === 'live');
    if (media.hasVideo === wantVideo && allLive) return media.stream;
    releaseMedia();                    // mode switched or a track died — request fresh
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    video: wantVideo ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false,
  });
  media = { stream, hasVideo: !!stream.getVideoTracks().length };
  stream.getTracks().forEach(tr => tr.addEventListener('ended', () => {
    if (media && media.stream === stream) media = null;   // revoked / unplugged
  }));
  return stream;
}
function pickMime(kind){
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  const list = kind === 'video'
    ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  return list.find(m => MediaRecorder.isTypeSupported(m)) || '';
}
function extFor(mime, kind){
  if (/webm/.test(mime)) return 'webm';
  if (/mp4/.test(mime)) return kind === 'video' ? 'mp4' : 'm4a';
  if (/wav/.test(mime)) return 'wav';
  if (/ogg/.test(mime)) return 'ogg';
  return 'webm';
}
async function toggleRecord(){ rec ? stopRecording() : await startRecording(); }
async function startRecording(){
  if (rec) return;
  const wantVideo = $('#videoChk').checked;
  let stream;
  try { stream = await getMedia(wantVideo); }
  catch (err){ toast('mic/camera unavailable: ' + (err.name || err.message)); return; }
  ensureCtx(); try { await audioCtx.resume(); } catch (e) {}
  const kind = stream.getVideoTracks().length ? 'video' : 'audio';
  const mime = pickMime(kind);
  let recorder;
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e){
    try { recorder = new MediaRecorder(stream); }
    catch (e2){ toast('MediaRecorder unavailable in this browser'); stream.getTracks().forEach(t => t.stop()); return; }
  }
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onerror = () => toast('recorder error');
  recorder.onstop = () => {
    const r = rec; if (!r) return;
    const blob = new Blob(r.chunks, { type: r.recorder.mimeType || 'audio/webm' });
    const dur = (performance.now() - r.startWall) / 1000;
    cleanupRecUI(r);
    rec = null;
    document.body.classList.remove('recording');
    commitTake({ blob, kind: r.kind, start: r.startPos, duration: dur, mime: blob.type });
  };
  recorder.start(1000);
  rec = {
    recorder, stream, chunks, kind,
    startPos: state.playhead,
    startWall: performance.now(),
  };
  document.body.classList.add('recording');
  startRecUI();
  toast(kind === 'video' ? 'recording video — press again to stop' : 'recording — press again to stop');
}
function stopRecording(){ if (rec){ try { rec.recorder.stop(); } catch (e) {} } }
function startRecUI(){
  const r = rec;
  if (r.kind === 'video'){
    const v = $('#camPreview'); v.srcObject = r.stream; v.classList.remove('hidden'); v.play().catch(() => {});
  }
  try {
    r.srcNode = audioCtx.createMediaStreamSource(r.stream);
    r.analyser = audioCtx.createAnalyser(); r.analyser.fftSize = 512;
    r.srcNode.connect(r.analyser);   // never to destination — no feedback
  } catch (e) {}
  const buf = new Uint8Array(256);
  const tick = () => {
    if (!rec) return;
    $('#time').textContent = 'REC ' + fmtTime((performance.now() - rec.startWall) / 1000);
    if (rec.analyser){
      rec.analyser.getByteTimeDomainData(buf);
      let pk = 0;
      for (let i = 0; i < buf.length; i++){ const d = Math.abs(buf[i] - 128) / 128; if (d > pk) pk = d; }
      $('#meterFill').style.setProperty('--lvl', Math.min(1, pk * 1.4).toFixed(3));
    }
    rec.raf = requestAnimationFrame(tick);
  };
  tick();
}
function cleanupRecUI(r){
  if (r && r.raf) cancelAnimationFrame(r.raf);
  const v = $('#camPreview'); v.srcObject = null; v.classList.add('hidden');
  $('#meterFill').style.setProperty('--lvl', 0);
  updateTimeReadout();
}

function commitTake({ blob, kind, start, duration, mime, recordedAt }){
  const t = {
    id: uid(),
    name: 'Take ' + (state.takes.length + 1),
    kind: kind || 'audio',
    start: Math.max(0, start || 0),
    duration: duration || 0,
    recordedAt: recordedAt || isoNow(),
    bpm: null, key: '', tags: [], notes: '', keep: false,
    mime: mime || blob.type || 'audio/webm',
    blob, buffer: null, peaks: null, lane: 0,
  };
  t.ext = extFor(t.mime, t.kind);
  state.takes.push(t);
  refresh();
  ensurePeaks(t);
  select(t.id);
  idbPutTake(t);
  return t;
}

/* ---------- playback ---------- */
async function togglePlay(){ state.playing ? pausePlayback() : await startPlayback(); }
async function startPlayback(){
  if (!state.takes.length) return;
  ensureCtx(); try { await audioCtx.resume(); } catch (e) {}
  stopSources();
  const end = contentEnd();
  let pos = state.playhead >= end - 0.05 ? 0 : state.playhead;
  state.playhead = pos;
  play.startCtx = audioCtx.currentTime; play.startPos = pos;
  for (const t of state.takes){
    if (t.kind !== 'audio' || !t.buffer) continue;
    if (t.start + t.duration <= pos || t.start >= end) continue;
    const src = audioCtx.createBufferSource();
    src.buffer = t.buffer; src.connect(audioCtx.destination);
    if (t.start >= pos) src.start(play.startCtx + (t.start - pos), 0, t.duration);
    else src.start(play.startCtx, pos - t.start, t.duration - (pos - t.start));
    play.sources.push(src);
  }
  state.playing = true;
  document.body.classList.add('playing');
  rafLoop();
}
function pausePlayback(){
  stopSources(); pauseVideos();
  state.playing = false;
  document.body.classList.remove('playing');
  if (play.raf) cancelAnimationFrame(play.raf);
  updateTimeReadout();
}
function stopSources(){ play.sources.forEach(s => { try { s.stop(); } catch (e) {} }); play.sources = []; }
function rafLoop(){
  if (!state.playing) return;
  const pos = play.startPos + (audioCtx.currentTime - play.startCtx);
  state.playhead = pos;
  syncPlayheadUI(pos); syncVideos(pos); updateTimeReadout(); followPlayhead();
  if (pos >= contentEnd()){
    pausePlayback();
    state.playhead = contentEnd(); syncPlayheadUI(state.playhead);
    return;
  }
  play.raf = requestAnimationFrame(rafLoop);
}
function syncVideos(pos){
  for (const t of state.takes){
    if (t.kind !== 'video' || !t.duration) continue;
    const rel = pos - t.start;
    const active = rel >= 0 && rel < t.duration - 0.05;
    let v = play.videos.get(t.id);
    if (active){
      if (!v){
        v = document.createElement('video');
        v.src = URL.createObjectURL(t.blob); v.preload = 'auto'; v.className = 'tl-video';
        document.body.appendChild(v); play.videos.set(t.id, v);
      }
      if (v.readyState >= 1 && Math.abs(v.currentTime - rel) > 0.3) v.currentTime = rel;
      if (v.paused) v.play().catch(() => {});
    } else if (v && !v.paused) v.pause();
  }
}
function pauseVideos(){ play.videos.forEach(v => v.pause()); }
function seekTo(pos){
  state.playhead = Math.max(0, pos);
  if (state.playing) startPlayback();
  else { syncPlayheadUI(state.playhead); updateTimeReadout(); followPlayhead(); }
}

/* ---------- transport UI ---------- */
function syncPlayheadUI(pos){ $('#playhead').style.left = (pos * state.zoom) + 'px'; }
function updateTimeReadout(){ $('#time').textContent = fmtTime(state.playhead); }
function followPlayhead(){
  const tl = $('#tl'), x = state.playhead * state.zoom;
  if (x < tl.scrollLeft || x > tl.scrollLeft + tl.clientWidth - 60)
    tl.scrollLeft = x - tl.clientWidth * 0.2;
}

/* ---------- export: markdown + YAML front matter + media ---------- */
// filename-safe key: keep letters/digits/# (F#m stays readable), drop path-hostile chars
const keySlug = k => String(k || '').trim().replace(/\s+/g, '-').replace(/[\/\\?%*:|*"<>]/g, '');
// percent-encode chars that break markdown link targets (# is read as a URL fragment)
const mdUrl = s => String(s).replace(/%/g, '%25').replace(/#/g, '%23');
// prefix as YYYY-MM-DD-[(X)bpm]-[(X)key]-title; unspecified segments are skipped
function filePrefix(title, bpm, key, dateStr){
  const bits = [(dateStr || isoNow()).slice(0, 10)];
  if (bpm) bits.push(Number(bpm) + 'bpm');
  if (keySlug(key)) bits.push(keySlug(key));
  bits.push(slug(title));
  return bits.join('-');
}
// export base name; seconds stamp keeps same-day exports from colliding
function exportBase(){ return filePrefix(state.session.name, state.session.bpm, state.session.key) + '-' + isoNow().slice(11, 19).replaceAll(':', ''); }
async function buildExport(){
  const ts = [...state.takes].sort((a, b) => a.start - b.start);
  for (const t of ts) await ensurePeaks(t);   // decode so audio can be written as WAV
  const used = new Set();
  const entries = ts.map((t, i) => {
    let base = String(i + 1).padStart(3, '0') + '-' + filePrefix(t.name, t.bpm, t.key, t.recordedAt), name = base, k = 2;
    while (used.has(name)) name = base + '-' + k++;
    used.add(name);
    // audio takes are written as DAW-ready 16-bit WAV when decoded; otherwise the original container
    let mediaName, mediaData;
    if (t.kind === 'audio' && t.buffer){ mediaName = name + '.wav'; mediaData = wavBlobFromBuffer(t.buffer); }
    else { mediaName = name + '.' + (t.ext || 'webm'); mediaData = t.blob; }
    return { t, name, mediaName, mediaData, md: takeMarkdown(t, mediaName) };
  });
  return entries;
}
function takeMarkdown(t, mediaName){
  const y = ['---'];
  y.push('title: ' + q(t.name));
  y.push('media: ' + q(mediaName));
  y.push('start: ' + t.start.toFixed(2));
  y.push('duration: ' + t.duration.toFixed(2));
  y.push('recorded: ' + q(t.recordedAt));
  if (t.bpm) y.push('bpm: ' + t.bpm);
  if (t.key) y.push('key: ' + q(t.key));
  const bp = barPos(t.start);
  if (bp) y.push('bar_beat: ' + bp);
  if (t.keep) y.push('keep: true');
  if (t.tags && t.tags.length) y.push('tags: [' + t.tags.map(q).join(', ') + ']');
  y.push('---', '');
  y.push('![](' + mdUrl(mediaName) + ')', '');
  y.push((t.notes || '').trim());
  return y.join('\n') + '\n';
}
function cuesMarkdown(){
  const y = ['---'];
  y.push('title: ' + q('Cues — ' + (state.session.name || 'Session ' + (state.session.created || '').slice(0, 10))));
  y.push('cues: ' + state.cues.length);
  if (state.session.bpm) y.push('bpm: ' + state.session.bpm);
  y.push('---', '');
  for (const c of state.cues){
    const head = '**' + fmtClock(c.pos) + (barPos(c.pos) ? ' (bar ' + barPos(c.pos) + ')' : '') + (c.name ? ' — ' + c.name : '') + '**';
    y.push('- ' + head + (c.notes ? '  \n  ' + c.notes.replace(/\n/g, '  \n  ') : ''));
  }
  if (!state.cues.length) y.push('(no cues)');
  return y.join('\n') + '\n';
}
function sessionMarkdown(entries){
  const s = state.session;
  const y = ['---'];
  y.push('title: ' + q(s.name || 'Session ' + (s.created || '').slice(0, 10)));
  if (s.bpm) y.push('bpm: ' + s.bpm);
  if (s.key) y.push('key: ' + q(s.key));
  if ((s.notes || '').trim()) y.push('notes: ' + q(s.notes.trim()));
  y.push('cues: ' + q('cues.md'));
  y.push('created: ' + q(s.created));
  y.push('exported: ' + q(isoNow()));
  y.push('takes: ' + entries.length);
  y.push('---', '', '');
  for (const e of entries){
    const t = e.t, bits = [fmtClock(t.start) + '–' + fmtClock(t.start + t.duration)];
    const bp = barPos(t.start), bpe = barPos(t.start + t.duration);
    if (bp) bits.push((bpe && bpe !== bp ? bp + '–' + bpe : 'bar ' + bp));
    if (t.bpm) bits.push(t.bpm + ' bpm');
    if (t.key) bits.push(t.key);
    if (t.keep) bits.push('keep');
    y.push('- [' + t.name.replace(/([\[\]])/g, '\\$1') + '](' + mdUrl(e.name) + '.md) · [' + e.mediaName + '](' + mdUrl(e.mediaName) + ') — ' + bits.join(' · '));
  }
  if (state.cues.length)
    y.push('', '- [' + state.cues.length + ' cue' + (state.cues.length > 1 ? 's' : '') + '](cues.md)');
  return y.join('\n') + '\n';
}
function wavBlobFromBuffer(buf){
  const ch = Math.min(2, buf.numberOfChannels), sr = buf.sampleRate, len = buf.length;
  const bytes = 44 + len * ch * 2;
  const ab = new ArrayBuffer(bytes), dv = new DataView(ab);
  const W = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  W(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); W(8, 'WAVE'); W(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
  W(36, 'data'); dv.setUint32(40, len * ch * 2, true);
  const chans = [];
  for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++)
    for (let c = 0; c < ch; c++){
      const v = clamp(chans[c][i], -1, 1);
      dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2;
    }
  return new Blob([ab], { type: 'audio/wav' });
}

/* File System Access API: write straight into a real directory */
async function exportDirectory(){
  const entries = await buildExport();
  const dirName = exportBase();
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
  const sub = await dir.getDirectoryHandle(dirName, { create: true });
  const files = [{ name: 'session.md', text: sessionMarkdown(entries) }, { name: 'cues.md', text: cuesMarkdown() }];
  for (const e of entries){
    files.push({ name: e.name + '.md', text: e.md });
    files.push({ name: e.mediaName, data: e.mediaData });
  }
  for (const f of files){
    const fh = await sub.getFileHandle(f.name, { create: true });
    const w = await fh.createWritable();
    await w.write(f.data ?? new Blob([f.text], { type: 'text/markdown' }));
    await w.close();
  }
  toast('exported ' + files.length + ' files to ' + dirName + '/');
}

/* zip fallback (stored, no compression) for browsers without the picker */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; }
  return t;
})();
function crc32(u8){ let c = ~0; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (~c) >>> 0; }
async function exportZip(){
  const entries = await buildExport();
  const zipFiles = [{ name: 'session.md', text: sessionMarkdown(entries) }, { name: 'cues.md', text: cuesMarkdown() }];
  for (const e of entries){
    zipFiles.push({ name: e.name + '.md', text: e.md });
    zipFiles.push({ name: e.mediaName, data: e.mediaData });
  }
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const dt = new Date();
  const dosTime = (dt.getHours() << 11 | dt.getMinutes() << 5 | dt.getSeconds() >> 1) & 0xFFFF;
  const dosDate = ((dt.getFullYear() - 1980) << 9 | (dt.getMonth() + 1) << 5 | dt.getDate()) & 0xFFFF;
  for (const f of zipFiles){
    const data = new Uint8Array(await (f.data ?? new Blob([f.text], { type: 'text/markdown' })).arrayBuffer());
    const name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;
  }
  let cdSize = 0; for (const c of central) cdSize += c.byteLength;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
  eocd.setUint16(8, zipFiles.length, true); eocd.setUint16(10, zipFiles.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true); eocd.setUint16(20, 0, true);
  const blob = new Blob([...parts, ...central, eocd.buffer], { type: 'application/zip' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportBase() + '.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  toast('zip downloaded — ' + zipFiles.length + ' files');
}
async function doExport(){
  if (!state.takes.length){ toast('nothing to export yet — record something first'); return; }
  try {
    if (window.showDirectoryPicker){
      try { await exportDirectory(); return; }
      catch (e){ if (e && e.name === 'AbortError') return; console.warn('directory export failed, falling back to zip', e); }
    }
    await exportZip();
  } catch (err){ toast('export failed: ' + (err.message || err)); }
}

/* ---------- wiring ---------- */
function setZoom(z){
  state.zoom = clamp(z, 8, 200);
  refresh();
}
const saveSessionMeta = debounce(() => idbSetMeta('session', state.session), 300);

/* click-to-edit chips: small label expands into an input on click */
function chipValue(chip){ return chip.id === 'bpmChip' ? (state.session.bpm ?? '') : (state.session.key || ''); }
function renderChips(){
  const b = $('#bpmChip'), k = $('#keyChip');
  if (b) b.querySelector('.cv').textContent = state.session.bpm ? state.session.bpm + ' bpm' : '';
  if (k) k.querySelector('.cv').textContent = state.session.key || '';
}
// session bpm changed: bar positions & metadata readouts shift — refresh visible text
function onBpmChange(){
  const t = takeById(state.selectedId);
  if (t && t.el) updateBarText(t);
  const pm = $('#panel .pmeta');
  if (t && pm) pm.innerHTML = pmetaHTML(t);
}
function wireChip(chip, commit){
  const fld = chip.querySelector('.fld');
  const close = () => {
    if (!chip.classList.contains('edit')) return;
    commit(fld.value);
    chip.classList.remove('edit');
    renderChips();
  };
  const open = () => {
    chip.classList.add('edit');
    fld.value = chipValue(chip);
    fld.focus(); fld.select();
  };
  chip.addEventListener('click', e => {
    if (e.target === fld) return;
    if (!chip.classList.contains('edit')){ e.preventDefault(); open(); }
  });
  chip.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'Escape'){ e.preventDefault(); close(); }
  });
  fld.addEventListener('blur', close);
  fld.addEventListener('input', () => commit(fld.value));   // live-commit while typing
}
function wire(){
  $('#recBtn').addEventListener('click', toggleRecord);
  $('#playBtn').addEventListener('click', togglePlay);
  $('#videoChk').addEventListener('change', releaseMedia);   // device mode changed — let the next take re-request
  $('#zoomIn').addEventListener('click', () => setZoom(state.zoom * 1.4));
  $('#zoomOut').addEventListener('click', () => setZoom(state.zoom / 1.4));
  $('#exportBtn').addEventListener('click', doExport);
  $('#zipBtn').addEventListener('click', exportZip);
  $('#newBtn').addEventListener('click', newSession);
  $('#sessionName').addEventListener('input', e => { state.session.name = e.target.value; saveSessionMeta(); });
  wireChip($('#bpmChip'), v => {
    state.session.bpm = v === '' ? null : (parseFloat(v) || null);
    saveSessionMeta(); onBpmChange();
  });
  wireChip($('#keyChip'), v => { state.session.key = v.trim(); saveSessionMeta(); });

  // scrub-seek on the ruler and empty timeline space; a click (no drag) deselects
  // the take and shows session notes
  let downX = 0, downY = 0;
  $('#content').addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    downX = e.clientX; downY = e.clientY;
    const onBar = !!e.target.closest('.bar');
    const wasPlaying = state.playing;
    if (wasPlaying) pausePlayback();
    const tl = $('#tl');
    const seek = ev => {
      const r = tl.getBoundingClientRect();
      seekTo(Math.max(0, (ev.clientX - r.left + tl.scrollLeft) / state.zoom));
    };
    seek(e);
    const mv = ev => seek(ev);
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', ev => {
      window.removeEventListener('pointermove', mv);
      const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY) > 4;
      if (!onBar && !moved && (state.selectedId || state.selectedCueId)){ select(null); }
      else if (wasPlaying && !moved) startPlayback();
    }, { once: true });
  });

  $('#tl').addEventListener('scroll', drawRuler);

  // double-click the ruler (or timeline background) to drop a cue
  const cueAt = ev => {
    const tl = $('#tl');
    const r = tl.getBoundingClientRect();
    return Math.max(0, (ev.clientX - r.left + tl.scrollLeft) / state.zoom);
  };
  $('#rulerWrap').addEventListener('dblclick', e => { e.preventDefault(); addCue(cueAt(e)); });
  $('#content').addEventListener('dblclick', e => {
    if (e.target.closest('.bar') || e.target.closest('.cue')) return;
    addCue(cueAt(e));
  });

  window.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if (e.key === 'r' || e.key === 'R') toggleRecord();
  });
  window.addEventListener('beforeunload', e => {
    releaseMedia();
    if (rec){ e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('resize', debounce(() => { sizeRuler(); drawRuler(); }, 120));
}
function newSession(){
  if (state.takes.length && !confirm('Start a new session? All current takes are deleted from this browser.')) return;
  pausePlayback();
  releaseMedia();
  for (const t of state.takes) idbDelTake(t.id);
  play.videos.forEach(v => { URL.revokeObjectURL(v.src); v.remove(); });
  play.videos.clear();
  state.takes = [];
  state.cues = [];
  state.selectedId = null;
  state.selectedCueId = null;
  state.playhead = 0;
  state.session = { name: '', bpm: null, key: '', notes: '', created: isoNow() };
  idbSetMeta('session', state.session);
  idbSetMeta('cues', state.cues);
  $('#sessionName').value = '';
  renderChips();
  refresh(); renderPanel();
}

/* ---------- boot ---------- */
async function init(){
  wire();
  try { await idbOpen(); }
  catch (e){ toast('storage unavailable — takes will not survive a reload'); }
  if (db){
    const s = await idbGetMeta('session');
    if (s && s.created) state.session = s;
    const cs = await idbGetMeta('cues');
    if (Array.isArray(cs)) state.cues = cs.sort((a, b) => a.pos - b.pos);
    state.takes = (await idbAllTakes()).sort((a, b) => (a.recordedAt < b.recordedAt ? -1 : 1));
    state.takes.forEach(t => { t.buffer = null; t.peaks = null; t.el = null; });
  }
  $('#sessionName').value = state.session.name || '';
  renderChips();
  refresh(); renderPanel(); updateTimeReadout();
  state.takes.forEach(t => ensurePeaks(t));
  if (state.takes.length) toast(state.takes.length + ' take' + (state.takes.length > 1 ? 's' : '') + ' restored');
}
document.addEventListener('DOMContentLoaded', init);
</script>
