  // masthead: click the title to rename; click bpm/key to open the menu on that section
  $("#masthead").addEventListener("click", e => {
    const chip = e.target.closest(".m-chip")
    if (chip){
      openMenu()
      const sec = (chip.id === "mastBpm" ? $("#bpmVal") : $("#keyMajor")).closest(".m-sec")
      sec.scrollIntoView({ block: "nearest" })
      return
    }
    if (performance.now() - renamedAt < 250) return   // the blur that committed a rename also lands here
    startRename($("#masthead"))
  })
  $("#mastTitle").addEventListener("keydown", e => { if (e.key === "Enter") startRename($("#masthead")) })
  $("#burger").addEventListener("click", () => { ovlIsOpen("#menuOvl") ? closeMenu() : openMenu() })

  // menu wiring
  buildKeyGrids()
  document.querySelectorAll("[data-close]").forEach(n => n.addEventListener("click", () => {
    if (n.dataset.close === "menu") closeMenu(); else dismissView()
  }))
  $("#mNew").addEventListener("click", () => { closeMenu(); newSession() })
  $("#mExport").addEventListener("click", () => doExport())
  $("#mRender").addEventListener("click", () => renderSession())
  $("#bpmClear").addEventListener("click", () => { state.session.bpm = null; saveSessionMeta(); syncMenu(); renderMasthead(); onBpmChange() })
  $("#keyClear").addEventListener("click", () => { state.session.key = ""; saveSessionMeta(); syncMenu(); renderMasthead() })
  holdable($("#bpmDown"), () => bpmStep(-1))
  holdable($("#bpmUp"), () => bpmStep(1))
  $("#mTags").addEventListener("input", e => { state.session.tags = e.target.value.split(",").map(s => s.trim()).filter(Boolean); saveSessionMeta() })
  $("#mNotes").addEventListener("input", e => { state.session.notes = e.target.value; saveSessionMeta() })
  trapFocus($("#menuPanel"))
  trapFocus($("#viewPanel"))

  // scrub-seek on the ruler and empty timeline space; a click (no drag) deselects
  // the take and closes the detail view
  let downX = 0, downY = 0
  $("#content").addEventListener("pointerdown", e => {
    if (e.button !== 0) return
    downX = e.clientX; downY = e.clientY
    const onBar = !!e.target.closest(".bar")
    const wasPlaying = state.playing
    if (wasPlaying) pausePlayback()
    const tl = $("#tl")
    const seek = ev => {
      const r = tl.getBoundingClientRect()
      seekTo(Math.max(0, (ev.clientX - r.left + tl.scrollLeft) / state.zoom))
    }
    seek(e)
    const mv = ev => seek(ev)
    window.addEventListener("pointermove", mv)
    window.addEventListener("pointerup", ev => {
      window.removeEventListener("pointermove", mv)
      const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY) > 4
      if (!onBar && !moved && (state.selectedId || state.selectedCueId)){ dismissView() }
      else if (wasPlaying && !moved) startPlayback()
    }, { once: true })
  })

  $("#tl").addEventListener("scroll", drawRuler)

  // double-click the ruler (or timeline background) to drop a cue
  const cueAt = ev => {
    const tl = $("#tl")
    const r = tl.getBoundingClientRect()
    return Math.max(0, (ev.clientX - r.left + tl.scrollLeft) / state.zoom)
  }
  $("#rulerWrap").addEventListener("dblclick", e => { e.preventDefault(); addCue(cueAt(e)) })
  $("#content").addEventListener("dblclick", e => {
    if (e.target.closest(".bar") || e.target.closest(".cue")) return
    addCue(cueAt(e))
  })

  window.addEventListener("keydown", e => {
    if (e.target.matches("input, textarea, select")) return
    if (e.key === "Escape"){
      if (ovlIsOpen("#menuOvl")) closeMenu()
      else if (ovlIsOpen("#viewOvl")) dismissView()
      else if (state.page === "record") setPage("timeline")
      return
    }
    if (ovlIsOpen("#menuOvl") || ovlIsOpen("#viewOvl")) return
    // the red page has no transport, and playing the other takes out loud would bleed
    // straight back into a live mic — so record is the only key that means anything there
    if (state.page === "record"){
      if (e.key === "r" || e.key === "R") toggleRecord()
      return
    }
    if (e.code === "Space"){ e.preventDefault(); togglePlay() }
    else if (e.key === "r" || e.key === "R") toggleRecord()
  })
  window.addEventListener("beforeunload", e => {
    releaseMedia()
    if (rec){ e.preventDefault(); e.returnValue = "" }
  })
  window.addEventListener("resize", debounce(() => { sizeRuler(); drawRuler() }, 120))
}
function newSession(){
  if (state.takes.length && !confirm("Start a new session? All current takes are deleted from this browser.")) return
  pausePlayback()
  releaseMedia()
  for (const t of state.takes) idbDelTake(t.id)
  play.videos.forEach(v => { URL.revokeObjectURL(v.src); v.remove() })
  play.videos.clear()
  state.takes = []
  state.cues = []
  state.selectedId = null
  state.selectedCueId = null
  state.playhead = 0
  state.session = { name: "", bpm: null, key: "", tags: [], notes: "", created: isoNow() }
  idbSetMeta("session", state.session)
  idbSetMeta("cues", state.cues)
  closeView()
  renderMasthead()
  refresh()
}

/* ---------- boot ---------- */
async function init(){
  wire()
  try { await idbOpen() }
  catch (e){ toast("storage unavailable — takes will not survive a reload") }
  if (db){
    const s = await idbGetMeta("session")
    if (s && s.created){
      state.session = s
      if (!Array.isArray(s.tags)) state.session.tags = []   // sessions saved before tags existed
    }
    const cs = await idbGetMeta("cues")
    if (Array.isArray(cs)) state.cues = cs.sort((a, b) => a.pos - b.pos)
    const page = await idbGetMeta("page")
    if (page === "record" || page === "timeline") state.page = page
    const video = await idbGetMeta("video")
    if (typeof video === "boolean"){ $("#videoChk").checked = video; $("#recVideoChk").checked = video }
    state.takes = (await idbAllTakes()).sort((a, b) => (a.recordedAt < b.recordedAt ? -1 : 1))
    state.takes.forEach(t => { t.buffer = null; t.peaks = null; t.el = null })
  }
  renderMasthead()
  refresh(); updateTimeReadout()
  applyView(false)          // restore the page you left, without yanking focus on load
  syncVideoPreview()        // reopen the self-view if we came back to the video page
  state.takes.forEach(t => ensurePeaks(t))
  if (state.takes.length) toast(state.takes.length + " take" + (state.takes.length > 1 ? "s" : "") + " restored")
}
document.addEventListener("DOMContentLoaded", init)
</script>
